<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ed">
    <title>치바쿠지 입고 상품 안내</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="치바쿠지 입고 상품 안내 홈">
        <span class="brand-mark">K</span>
        <span>치바쿠지 입고 안내</span>
      </a>
      <a class="admin-link" href="admin/">관리자 로그인</a>
    </header>

    <main class="page-shell">
      <section class="intro">
        <p class="eyebrow">치바쿠지 입고 안내</p>
        <h1>치바쿠지에<br><span>입고될 상품 리스트</span></h1>
        <p class="intro-copy">앞으로 입고될 상품을 미리 확인해 보세요.</p>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">입고 예정 상품</p>
            <h2 id="list-title">치바쿠지 입고 상품 <span id="product-count" class="count-badge">0</span></h2>
          </div>
          <a class="text-link" href="admin/">관리자 페이지 <span aria-hidden="true">↗</span></a>
        </div>
        <p id="public-error" class="error-message" role="alert" hidden></p>
        <div id="selected-products" class="product-grid"></div>
        <div id="empty-state" class="empty-state">
          <span class="empty-icon" aria-hidden="true">✳</span>
          <h3>등록된 입고 예정 상품이 없습니다</h3>
          <p>관리자가 상품을 등록하면 이곳에서 확인할 수 있습니다.</p>
        </div>
      </section>
      <p class="source-note">상품 정보와 이미지는 <a href="https://1kuji.com/products" target="_blank" rel="noopener noreferrer">1kuji.com</a>에서 불러옵니다.</p>
    </main>
    <footer class="site-footer">치바쿠지 입고 예정 상품 안내</footer>
  </body>
</html>
