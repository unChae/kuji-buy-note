<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ed">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>치바쿠지 입고 상품 안내</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <dialog class="receipt-dialog" id="public-request-dialog" aria-labelledby="public-request-title">
      <h2 id="public-request-title">업체별 입고 요청 수량</h2>
      <p id="public-request-product"></p>
      <dl class="public-request-suppliers" id="public-request-suppliers"></dl>
      <p id="public-request-empty" hidden>등록된 입고 요청이 없습니다.</p>
      <form class="auth-actions" method="dialog">
        <button class="button button-outline" type="submit" autofocus>닫기</button>
      </form>
    </dialog>
    <header class="site-header">
      <a class="brand" href="./" aria-label="치바쿠지 입고 상품 안내 홈">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><ellipse cx="7" cy="13" rx="3" ry="4" transform="rotate(-25 7 13)"/><ellipse cx="12" cy="6.5" rx="3" ry="4" transform="rotate(-10 12 6.5)"/><ellipse cx="21" cy="6.5" rx="3" ry="4" transform="rotate(10 21 6.5)"/><ellipse cx="26" cy="13" rx="3" ry="4" transform="rotate(25 26 13)"/><path d="M16 15c-3 0-4 3-6 5-3 4-1 8 3 7l3-1 3 1c4 1 6-3 3-7-2-2-3-5-6-5Z"/></svg></span>
        <span>치바쿠지 입고 안내</span>
      </a>
      <a class="admin-link" href="admin/">관리자 로그인</a>
    </header>

    <main class="page-shell">
      <section class="intro">
        <h1>치바쿠지에<br><span>입고될 <em class="title-accent">상품 리스트</em></span></h1>
        <p class="intro-copy">앞으로 입고될 상품을 미리 확인해 보세요.</p>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="section-heading">
          <div>
            <h2 id="list-title"><span id="list-title-text">입고 예정 상품</span> <span id="product-count" class="count-badge">0</span></h2>
          </div>
          <a class="text-link" href="admin/">관리자 페이지 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="public-view-switch" id="public-view-switch" role="group" aria-label="상품 보기 선택">
          <button type="button" data-public-view="incoming" aria-pressed="true">치바쿠지 입고 예정</button>
          <button type="button" data-public-view="all" aria-pressed="false">전체 보기</button>
        </div>
        <p id="public-catalog-range" class="public-catalog-range" hidden></p>
        <p id="public-error" class="error-message" role="alert" hidden></p>
        <div id="public-loading" class="public-loading" role="status"><p class="card-loading"><span class="loading-dot" aria-hidden="true"></span>상품 목록을 불러오는 중…</p></div>
        <div id="selected-products" class="arrival-months" aria-busy="true"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">✳</span>
          <h3 id="public-empty-title">등록된 입고 예정 상품이 없습니다</h3>
          <p id="public-empty-copy">관리자가 상품을 등록하면 이곳에서 확인할 수 있습니다.</p>
        </div>
      </section>
      <p class="source-note">상품 정보와 이미지는 <a href="https://1kuji.com/products" target="_blank" rel="noopener noreferrer">1kuji.com</a>에서 불러옵니다.</p>
    </main>
    <footer class="site-footer">도매 문의는 <a href="mailto:chibapick@gmail.com">chibapick@gmail.com</a>으로 부탁드립니다.</footer>
  </body>
</html>
