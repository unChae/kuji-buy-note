<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ed">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>상품 관리 · 치바쿠지 입고 안내</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../config.js" defer></script>
    <script src="../app.js" defer></script>
  </head>
  <body>
    <dialog class="receipt-dialog" id="receipt-dialog" aria-labelledby="receipt-title">
      <form id="receipt-form">
        <h2 id="receipt-title">업체별 입고 요청 수량</h2>
        <p id="receipt-product-name"></p>
        <div class="receipt-suppliers" id="receipt-suppliers"></div>
        <button class="button button-outline" id="receipt-add" type="button">+ 업체 추가</button>
        <p class="card-status" id="receipt-error" role="alert" hidden></p>
        <div class="auth-actions">
          <button class="button button-outline" id="receipt-close" type="button">닫기</button>
          <button class="button button-dark" id="receipt-save" type="submit">저장</button>
        </div>
      </form>
    </dialog>
    <template id="receipt-row-template">
      <div class="receipt-row">
        <label>업체명 <input name="supplier" maxlength="120" required></label>
        <label>요청 수량 <input name="quantity" type="number" min="0" max="2147483647" step="1" required></label>
        <button class="button button-outline" type="button" data-remove-supplier>삭제</button>
      </div>
    </template>
    <div class="auth-backdrop" id="admin-auth" hidden>
      <form class="auth-dialog" id="admin-auth-form" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <p class="eyebrow">관리자 로그인</p>
        <h1 id="auth-title">관리자 계정으로 로그인</h1>
        <p>등록된 관리자 이메일과 비밀번호를 입력해 주세요.</p>
        <label class="sr-only" for="admin-email">이메일</label>
        <input id="admin-email" type="email" autocomplete="username" placeholder="이메일" required>
        <label class="sr-only" for="admin-password">비밀번호</label>
        <input id="admin-password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <p class="auth-error" id="auth-error" role="alert" hidden>비밀번호가 올바르지 않습니다.</p>
        <div class="auth-actions">
          <a class="button button-outline" href="../">돌아가기</a>
          <button class="button button-dark" type="submit">확인</button>
        </div>
      </form>
    </div>
    <header class="site-header">
      <a class="brand" href="../">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><ellipse cx="7" cy="13" rx="3" ry="4" transform="rotate(-25 7 13)"/><ellipse cx="12" cy="6.5" rx="3" ry="4" transform="rotate(-10 12 6.5)"/><ellipse cx="21" cy="6.5" rx="3" ry="4" transform="rotate(10 21 6.5)"/><ellipse cx="26" cy="13" rx="3" ry="4" transform="rotate(25 26 13)"/><path d="M16 15c-3 0-4 3-6 5-3 4-1 8 3 7l3-1 3 1c4 1 6-3 3-7-2-2-3-5-6-5Z"/></svg></span>
        <span>치바쿠지 입고 안내</span>
      </a>
      <nav class="admin-navigation" aria-label="관리자 메뉴">
        <a class="admin-link" href="../">사용자 페이지로 돌아가기</a>
        <button class="admin-link logout-button" id="logout-link" type="button">로그아웃</button>
      </nav>
    </header>
    <main class="page-shell admin-main">
      <div class="admin-title-row">
        <div>
          <p class="eyebrow">상품 관리</p>
          <h1>입고 예정 상품 관리</h1>
          <p class="intro-copy" id="month-range"></p>
        </div>
        <span class="selection-status" id="selection-status" role="status"></span>
      </div>
      <p class="error-message admin-error" id="admin-error" role="alert" hidden></p>
      <div id="admin-months">
        <p class="loading-message">상품 목록을 준비하고 있습니다…</p>
      </div>
      <button class="button button-outline load-more-months" id="load-more-months" type="button" hidden>더 가져오기</button>
      <p class="source-note">상품을 선택하면 제목 번역·수량·가격을 자동 수집합니다. 계산 결과 확인 후 등록하세요. 출처: <a href="https://1kuji.com/products" target="_blank" rel="noopener noreferrer">1kuji.com</a> · <a href="https://kujimap.com/1bankuji" target="_blank" rel="noopener noreferrer">쿠지맵</a></p>
    </main>
  </body>
</html>
