name: Collect Product Quantities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,15 * * *"
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/collect-data.yml"
      - "scripts/collect-lots.cjs"
      - "scripts/catalog-store.cjs"
      - "lib/kujimap-browser.cjs"
      - "supabase/functions/products/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Restore last successful catalogue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { readCatalogueFromBranch } = require('./scripts/catalog-store.cjs');
            const content = await readCatalogueFromBranch(github, context.repo);
            if (content) {
              fs.mkdirSync('public/data', { recursive: true });
              fs.writeFileSync('public/data/lot-quantities.json', content);
            }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect lot sizes
        run: xvfb-run -a node scripts/collect-lots.cjs
      - name: Update data branch only
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { publishCatalogueToBranch } = require('./scripts/catalog-store.cjs');
            const content = fs.readFileSync('public/data/lot-quantities.json', 'utf8');
            await publishCatalogueToBranch(github, context.repo, content);
